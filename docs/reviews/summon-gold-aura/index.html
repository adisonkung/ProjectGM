<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ออร่าการ์ดทอง — ก่อน / หลัง</title>
<style>body{margin:24px;background:#16141d;color:#f4e7c9;font:16px system-ui}h1{font-size:24px}section{margin:32px 0}.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}figure{margin:0}img{width:100%;display:block}figcaption{padding:8px 0;color:#d1ba8c}a{color:#ebc67a}</style>
<h1>ออร่าการ์ดทอง: ย่อให้กระชับและแก้กรอบตอนเคลื่อน</h1><p>ซ้าย: ภาพจริงก่อนแก้ / ขวา: ภาพจริงหลังแก้ · Desktop 1280×720 · หยุดจังหวะแอนิเมชันเพื่อเทียบภาพ ไม่ใช่วิดีโอวัดความลื่น</p><p><a href="README.md">รายละเอียดและข้อจำกัด</a> · <a href="after-report.json">ผลตรวจในเกม</a></p>
<script>for(const count of [1,10])for(const [phase,name] of [['moving','กำลังลอย'],['waiting','รอเปิด'],['summary','เปิดครบ']]){const s=document.createElement('section');s.innerHTML=`<h2>${count} ใบ — ${name}</h2><div class="pair">${['before','after'].map((v,i)=>`<figure><a href="${v}-${count}-${phase}.png"><img src="${v}-${count}-${phase}.png" alt="${i?'หลัง':'ก่อน'}แก้ ${count} ใบ ${name}"></a><figcaption>${i?'หลัง':'ก่อน'}แก้</figcaption></figure>`).join('')}</div>`;document.body.append(s)}const s=document.createElement('section');s.innerHTML='<h2>เปิดการ์ดทองผ่าน intro จริง</h2><a href="after-1-opened.png"><img style="max-width:1000px" src="after-1-opened.png" alt="หลังแตะเปิดการ์ดทองผ่าน intro ในเกมจริง"></a>';document.body.append(s)</script>
