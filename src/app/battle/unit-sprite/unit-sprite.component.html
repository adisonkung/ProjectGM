@if (sprite() && def()) {
  <div #sheet class="sheet" [class.flip]="flip()" [class.pixelated]="!!def()?.pixelated" [style.background-image]="'url(' + url() + ')'" [style.background-size]="bgSize()" [style.aspect-ratio]="(def()?.cellW ?? 132) + ' / ' + (def()?.cellH ?? 100)" [style.width.%]="165 * (def()?.cellW ?? 132) / 132"></div>
} @else if (mock()) {
  <!-- placeholder art (core/data/visuals.ts): shape + colours only, gameplay never reads it -->
  <div [class]="'mock ' + mock()!.shape" [class.ghost]="!!mock()!.ghost" [class.flip]="flip()"
       [style.--mc]="mock()!.color" [style.--ma]="mock()!.accent" [style.--ms]="mock()!.size">
    <i class="body"></i>
    @if (mock()!.glyph) { <b>{{ mock()!.glyph }}</b> }
    <i class="eye"></i>
  </div>
} @else {
  <div class="token" [class.enemy]="side() === 'enemy'" [class.boss]="boss()" [style.--rc]="side() === 'enemy' ? null : rarity()">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      @switch (icon() ?? cls()) {
        @case ('wolf') { <path d="M4 10l3-6 3 4h4l3-4 3 6-2 7-5 3-5-3z" /><path d="M9 12h.01M15 12h.01M11 16h2" /> }
        @case ('tank') { <path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z" /><path d="M12 7v10" /> }
        @case ('fighter') { <path d="M19 4l-9 9M19 4h-4M19 4v4M8 12l4 4M5 19l3-3" /> }
        @case ('assassin') { <path d="M4 20l7-7M11 13l2-6 4-4-1 5-5 5zM20 20l-7-7" /> }
        @case ('archer') { <path d="M7 3c8 4 8 14 0 18M7 3v18M3 12h15M15 9l3 3-3 3" /> }
        @case ('mage') { <path d="M12 3l2.2 5.8L20 11l-5.8 2.2L12 19l-2.2-5.8L4 11l5.8-2.2z" /> }
        @case ('healer') { <path d="M10 4h4v6h6v4h-6v6h-4v-6H4v-4h6z" /> }
      }
    </svg>
  </div>
}
