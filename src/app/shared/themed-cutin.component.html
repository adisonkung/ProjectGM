<div class="stage" [class.water]="art().vfx === 'water'" [style.width]="art().stageWidth || null"
     [style.--accent]="art().accent" [style.aspect-ratio]="art().ratio"
     [style.--label-left]="art().left" [style.--label-top]="art().top" [style.--label-width]="art().width"
     [style.--title-size]="art().titleSize" [style.--name-size]="art().nameSize">
  <div class="aura" aria-hidden="true"></div>
  <img class="plate" [src]="'/' + art().file" [alt]="art().bakedText ? skill() + ' — ' + name() : ''" draggable="false" />
  @if (art().vfx === 'water') {
    <div class="water-burst" aria-hidden="true"><i></i><i></i><i></i></div>
    <svg class="water-ribbons" viewBox="0 0 1000 440" preserveAspectRatio="none" aria-hidden="true">
      <path class="current" d="M-20 424 Q160 330 315 365 T760 308 Q906 243 994 28" />
      <path class="current upper" d="M-10 168 Q100 -30 320 48 T680 68 Q860 68 1000 22" />
      <path class="glint" d="M0 395 735 308 994 28 M60 34 502 14" />
    </svg>
    <div class="water-droplets" aria-hidden="true">
      @for (i of motes; track i) { <i [style.--i]="i"></i> }
    </div>
  }
  <div class="energy" aria-hidden="true"></div>
  <div class="sweep" aria-hidden="true"></div>
  <div class="motes" aria-hidden="true">
    @for (i of motes; track i) { <i [style.--i]="i"></i> }
  </div>
  @if (!art().bakedText) {
  <div class="label" [class.add-stars]="art().addTitleStars"><small>ULTIMATE</small><b>{{ skill() }}</b></div>
  <div class="hero-name" [style.left]="art().nameLeft" [style.top]="art().nameTop"
       [style.width]="art().nameWidth" [style.height]="art().nameHeight">
    @if (!art().embeddedNameFrame) {
      <svg class="name-frame" viewBox="0 0 460 80" preserveAspectRatio="none" aria-hidden="true">
        <path class="name-fill" d="M3 40 43 3H417L457 40 417 77H43Z" />
        <path class="name-inset" d="M14 40 47 10H413L446 40 413 70H47Z" />
        <path class="name-flourish" d="M0 40H42M418 40H460M24 29 14 40 24 51M436 29 446 40 436 51" />
      </svg>
    }
    <span>{{ name() }}</span>
  </div>
  }
</div>
