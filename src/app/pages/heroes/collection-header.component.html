  <header class="collection-header">
    <div class="page-heading">
      <a class="back" routerLink="/home" aria-label="กลับหน้าหลัก"><app-collection-icon name="back" [size]="28" /></a>
      <div class="page-title"><h1 [id]="headingId()">{{ heading() }}</h1><span>{{ subtitle() }}</span></div>
    </div>
    <div class="collection-wallet" aria-label="ทรัพยากรและเมนู">
      @if (extra(); as x) { <div class="resource extra" [attr.title]="x.label + ' ' + x.value"><img [src]="x.icon" alt="" aria-hidden="true" width="20" height="22" /><b [attr.aria-label]="x.label + ' ' + x.value">{{ x.value }}</b></div> }
      <div class="resource" [attr.title]="'เพชร ' + gemsFull()"><app-collection-icon name="gem" [size]="19" /><b>{{ gems() }}</b><button type="button" (click)="soon()" aria-label="เติมเพชร">+</button></div>
      <div class="resource" [attr.title]="'ทอง ' + goldFull()"><i class="gold-coin" aria-hidden="true"></i><b>{{ gold() }}</b><button type="button" (click)="soon()" aria-label="เติมทอง">+</button></div>
      <button type="button" class="round" aria-label="กระเป๋า" aria-haspopup="dialog" (click)="bagOpen.set(true)"><app-line-icon name="bag" [size]="23" /></button>
      <button type="button" class="round" aria-label="ประกาศ" (click)="soon()"><app-collection-icon name="news" [size]="23" /></button>
      <button type="button" class="round" aria-label="จดหมาย" (click)="soon()"><app-line-icon name="mail" [size]="23" /><span class="badge">{{ mail }}</span></button>
      <button type="button" class="round" aria-label="เมนู" aria-haspopup="dialog" [attr.aria-expanded]="menuOpen()" (click)="menuOpen.set(true)"><app-line-icon name="grid" [size]="23" /><span class="badge">{{ menuBadge }}</span></button>
    </div>
  </header>

  @if (bagOpen()) { <app-home-bag (closed)="bagOpen.set(false)" /> }
  @if (menuOpen()) {
    <div class="panel-veil" (click)="menuOpen.set(false)" aria-hidden="true"></div>
    <section class="collection-menu" role="dialog" aria-modal="true" aria-labelledby="collection-menu-title" cdkTrapFocus [cdkTrapFocusAutoCapture]="true">
      <header><h2 id="collection-menu-title">เมนู</h2><button type="button" aria-label="ปิดเมนู" (click)="menuOpen.set(false)">×</button></header>
      <nav aria-label="เมนูหลัก">@for (d of destinations; track d.path) { <a [routerLink]="d.path"><app-line-icon [name]="d.icon" [size]="25" />{{ d.name }}</a> }</nav>
    </section>
  }
  @if (notice()) { <div class="collection-notice" role="status">{{ notice() }}<button type="button" aria-label="ปิดข้อความ" (click)="notice.set('')">×</button></div> }
