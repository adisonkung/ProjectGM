<section class="welcome reference-welcome">
  <div class="welcome-masthead"><img class="welcome-logo" src="/ui/branding/eldervane-wordmark-champagne.webp" alt="Eldervane" width="2023" height="456" fetchpriority="high" /></div>
  <div class="card gm-panel citadel-surface"><app-tower-ornament [grooved]="true" [ornate]="true" />
    <h1 class="welcome-title">ยินดีต้อนรับสู่ เอลเดอร์เวย์น</h1>
    @if (mode() === 'name') {
      <p class="lead">ตั้งชื่อเกาะของคุณ</p>
      <div class="account-divider" aria-hidden="true"><i></i></div>
      <form (submit)="$event.preventDefault(); start()">
        <div class="name-input-row">
          <label for="isle-name" class="lbl"><app-citadel-icon name="tower" [size]="30" />ชื่อเกาะ</label>
          <div class="field" [class.bad]="touched() && error()"><input id="isle-name" type="text" autocomplete="off" enterkeyhint="done" [attr.aria-describedby]="touched() && error() ? 'isle-meta isle-error' : 'isle-meta'" [attr.aria-invalid]="touched() && error() ? 'true' : null" [attr.maxlength]="max * 3" placeholder="เช่น เกาะดาราลอยฟ้า" [value]="name()" (input)="input($any($event.target).value)" /></div>
          <button type="button" class="dice citadel-surface citadel-control" (click)="suggest()" aria-label="สุ่มชื่อ" title="สุ่มชื่อ"><app-citadel-frame shape="panel" [cut]="12" /><svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><path d="m16 2 12 7v14l-12 7L4 23V9Z" fill="currentColor"/><g fill="#11171c"><circle cx="11" cy="11" r="2"/><circle cx="21" cy="11" r="2"/><circle cx="16" cy="16" r="2"/><circle cx="11" cy="21" r="2"/><circle cx="21" cy="21" r="2"/></g></svg></button>
        </div>
        <div class="meta" id="isle-meta"><span class="count" [class.over]="length() > max">{{ length() }}/{{ max }}</span></div>
        @if (touched() && error()) { <p class="account-alert" id="isle-error" role="alert"><span aria-hidden="true">!</span>{{ error() }}</p> }
        <button type="submit" class="gm-btn primary go citadel-surface citadel-control" [disabled]="!!error()"><app-citadel-frame shape="hex" [cut]="24" [crimson]="true" [lacquer]="true" /><app-citadel-icon name="tower" [size]="36" />เริ่มผจญภัย <app-citadel-icon name="arrow" [size]="24" /></button>
        <p class="hint">เปลี่ยนชื่อทีหลังได้ที่หน้า “บัญชี”</p>
      </form>
      <button type="button" class="switch" (click)="mode.set('import')"><app-icon name="restart" [size]="20" /> ย้ายเซฟจากเครื่องอื่น <app-citadel-icon name="arrow" [size]="16" /></button>
    } @else {
      <p class="lead">ย้ายเซฟจากเครื่องอื่น</p><div class="account-divider" aria-hidden="true"><i></i></div>
      <app-save-import (imported)="imported()" />
      <button type="button" class="switch" (click)="mode.set('name')"><app-icon name="back" [size]="18" /> เริ่มเกาะใหม่แทน</button>
    }
  </div>
</section>
