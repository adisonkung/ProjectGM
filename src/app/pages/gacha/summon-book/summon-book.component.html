@if (fallback() && active()) {
  <app-summon-scene [results]="results()" (done)="done.emit()" />
} @else if (!fallback()) {
  <dialog #stage class="book" [class.ready]="!loading() && active()" aria-label="กำลังอัญเชิญ" (cancel)="$event.preventDefault(); back()">
    <div #host class="book-host"></div>
    <div class="cap" style="opacity: 0" aria-hidden="true"><b></b><small></small></div>
    <div class="hint" role="status" hidden></div>
    <button type="button" class="summon" hidden><span>แตะเพื่ออัญเชิญ</span><small>TAP TO SUMMON</small></button>
    @if (loading()) { <p class="loading" role="status">กำลังอัญเชิญ…</p> }
    <div class="cine" hidden>
      <p class="cine-quote"></p>
      <div class="cine-ban"><img alt="" /><div class="cine-plate"><small class="cine-ep"></small><b class="cine-th"></b><span class="cine-en"></span><i aria-hidden="true">★ ★ ★</i></div></div>
      <span class="cine-tap">แตะเพื่อปิด</span>
    </div>
    @if (!finished()) { <button type="button" class="skip" (click)="skip()">ข้าม <span aria-hidden="true">»</span></button> }
    @if (finished()) {
      <button type="button" class="book-return" (click)="back()" aria-label="กลับหน้ากาชา"><app-icon name="back" [size]="22" /><span>ย้อนกลับ</span></button>
      <nav class="summary" aria-label="สรุปการอัญเชิญ"><app-summon-button class="again" [count]="repeatCount()" label="อัญเชิญอีกครั้ง" tone="repeat" [disabled]="!canRepeat()" (activate)="summonAgain()" /></nav>
    }
  </dialog>
}
