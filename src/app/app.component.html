<div class="app">
  <header class="top">
    <div class="brand"><b>Summon <span>Tower</span></b><small>ProjectGM · dev build</small></div>
    <div class="res">
      <span class="pill" title="เพชร"><i class="gem"></i>{{ save.state().gems }}</span>
      <span class="pill" title="ทอง"><i class="coin"></i>{{ save.state().gold }}</span>
    </div>
  </header>
  <nav class="tabs" aria-label="เมนูหลัก">
    @for (n of nav; track n.path) {
      <a [routerLink]="n.path" routerLinkActive="active" ariaCurrentWhenActive="page">{{ n.label }}</a>
    }
  </nav>
  <main><router-outlet /></main>
</div>
